<!DOCTYPE html>
<html lang="sw-TZ">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Historia ya Tanzania na Maadili</title>
  <meta name="title-id" content="pg001_sec001" />
  <meta name="page-section-id" content="1" />
  <link href="./content/tailwind_output.css" rel="stylesheet">
  <link href="./assets/libs/fontawesome/css/all.min.css" rel="stylesheet">
  <link href="./assets/fonts.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible&amp;display=swap" rel="stylesheet">

  <style>
    body,
    p,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    span,
    div,
    button,
    input,
    textarea,
    select {
      font-family: 'Atkinson Hyperlegible', 'Merriweather', sans-serif;
    }

    .cover-sheet {
      position: relative;
      aspect-ratio: 1116 / 1536;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 0 0 1px #e5e7eb;
    }

    .cover-title {
      width: 62%;
      margin: 9.5% auto 0;
      border: 4px solid #b6e1ee;
      border-radius: 2rem 2rem 2rem .65rem;
      background: linear-gradient(#39748d, #27647d 76%, #07506b);
      box-shadow: 5px 5px 0 #8fc4d7, inset 0 -8px 0 rgba(0, 47, 70, .35);
    }

    .cover-certificate {
      width: 54%;
      margin: 3.2% auto 0;
    }

    .cover-crop {
      position: absolute;
      height: 2px;
      width: 34px;
      background: #737373;
      opacity: .7;
    }

    .cover-crop::after {
      content: "";
      position: absolute;
      top: -17px;
      left: 16px;
      width: 2px;
      height: 34px;
      background: #737373;
    }

    .cover-swatch {
      display: flex;
      gap: 2px;
      position: absolute;
      top: 1.2%;
    }

    .cover-swatch span {
      display: block;
      width: 18px;
      height: 28px;
      border: 1px solid #555;
    }

    @media (max-width:639px) {
      .cover-title {
        width: 76%;
        margin-top: 11%;
        border-width: 3px;
        border-radius: 1.35rem 1.35rem 1.35rem .45rem;
      }

      .cover-certificate {
        width: 66%;
        margin-top: 5%;
      }

      .cover-swatch span {
        width: 9px;
        height: 15px;
      }
    }
  </style>
</head>

<body class="min-h-screen bg-zinc-800 flex items-start justify-center">
  <main class="w-full">
    <div id="content" class="mx-auto w-full max-w-[1116px] opacity-0">
      <section data-section-type="front_cover" data-section-id="pg001_sec001" class="cover-sheet">
        <div class="cover-crop left-[3%] top-[2.7%]"></div>
        <div class="cover-crop right-[3%] top-[2.7%] rotate-180"></div>
        <div class="cover-crop left-[3%] bottom-[2.7%]"></div>
        <div class="cover-crop right-[3%] bottom-[2.7%] rotate-180"></div>
        <div class="cover-swatch left-[7%]"><span class="bg-black"></span><span class="bg-zinc-800"></span><span
            class="bg-zinc-600"></span><span class="bg-zinc-400"></span><span class="bg-zinc-200"></span></div>
        <div class="cover-swatch right-[7%]"><span class="bg-yellow-300"></span><span class="bg-pink-600"></span><span
            class="bg-cyan-500"></span><span class="bg-indigo-800"></span><span class="bg-emerald-600"></span><span
            class="bg-red-600"></span></div>
        <div class="cover-title px-5 py-7 sm:px-10 sm:py-9">
          <h1 class="mx-auto text-center text-[2rem] font-extrabold leading-[1.08] text-white sm:text-[3.6rem]"
            data-id="pg001_n0002">Historia ya Tanzania<br>na Maadili</h1>
        </div>
        <div class="mt-[1.7%] text-center text-[#9c481d]">
          <div class="mt-6 flex flex-col items-center justify-center gap-2 sm:gap-3">
            <p class="text-[1.7rem] font-extrabold leading-none sm:text-[2.3rem]" data-id="pg001_n0004">
              Kitabu cha Mwanafunzi
            </p>
            <p class="text-[1.8rem] font-extrabold leading-none sm:text-[2.5rem]">Darasa la</p><span
              class="flex h-14 w-14 items-center justify-center rounded-full border-2 border-amber-200 bg-gradient-to-b from-amber-500 via-amber-700 to-amber-900 text-[2rem] font-extrabold leading-none text-white shadow-[inset_0_2px_0_rgba(255,255,255,.45),0_2px_5px_rgba(0,0,0,.25)] sm:h-16 sm:w-16 sm:text-[2.35rem]">5</span><span
              class="sr-only" data-id="pg001_n0005">Darasa la 5</span>
          </div>
        </div>
        <figure class="cover-certificate flex justify-center">
          <img data-id="pg001_im001" src="images/pg001_im001.jpg"
            alt="Cheti cha ithibati cha Wizara ya Elimu, Sayansi na Teknolojia cha kuidhinisha kitabu cha Historia ya Tanzania na Maadili."
            class="h-auto w-full" style="max-width:100%;height:auto;">
        </figure>
        <p class="mt-[.8%] text-center text-[1.55rem] font-extrabold leading-tight text-zinc-800 sm:text-[2rem]"
          data-id="pg001_n0006">Taasisi ya Elimu Tanzania</p>
      </section>
    </div>
  </main>
